name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://blazedkitty.com
          tags: |
            ghcr.io/dev-perceptric/blazed-kitty:latest
            ghcr.io/dev-perceptric/blazed-kitty:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the image is published, log into the VPS and swap the running container.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/blazed-kitty
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
